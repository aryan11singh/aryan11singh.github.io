<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | aryan11singh</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-500/30">

  <!-- Ambient Glow -->
  <div class="radial-glow top-1/4 left-1/3 w-96 h-96 bg-blue-600/15"></div>
  <div class="fixed inset-0 bg-grid-subtle pointer-events-none"></div>

  <div class="relative z-10 max-w-md w-full glass-card p-8 rounded-3xl border border-slate-800/80 text-center space-y-6 shadow-2xl">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
      <i data-lucide="compass" class="w-8 h-8"></i>
    </div>

    <div class="space-y-2">
      <div class="text-xs font-mono uppercase tracking-widest text-blue-400 font-semibold">Error 404</div>
      <h1 class="text-3xl font-extrabold text-slate-100">Page Not Found</h1>
      <p class="text-sm text-slate-400">
        The route you are looking for has moved or does not exist in this deployment.
      </p>
    </div>

    <div class="pt-2">
      <a href="./index.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 transition-all">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Return to Portfolio</span>
      </a>
    </div>

    <div class="pt-4 border-t border-slate-800 text-xs font-mono text-slate-500">
      aryan11singh.github.io &bull; Systems & AI
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
